<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Koinos Lab Marketplace helps scientific equipment circulate through donations, lending, requests, and reuse."
    />
    <title>Marketplace | Koinos Lab</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logos/koinos-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/logos/koinos-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logos/koinos-icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="marketplace">
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="./index.html" aria-label="Koinos Lab home">
          <img class="brand-logo" src="./assets/logos/koinos-primary.png" alt="Koinos Lab" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="Primary navigation" data-nav>
          <a href="./index.html" data-nav-page="home">Home</a>
          <a href="./devices.html" data-nav-page="devices">Devices</a>
          <a href="./marketplace.html" data-nav-page="marketplace">Marketplace</a>
          <a href="./publications.html" data-nav-page="publications">Publications</a>
          <a href="./vision.html" data-nav-page="vision">Vision</a>
          <a href="./team.html" data-nav-page="team">Our team</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="section-shell page-hero-layout">
          <div>
            <p class="eyebrow" data-field="marketplace.eyebrow"></p>
            <h1 data-field="marketplace.title"></h1>
          </div>
          <p class="lead" data-field="marketplace.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="section-shell marketplace-grid">
          <div class="feature-panel">
            <p class="eyebrow">Marketplace focus</p>
            <h2 data-field="marketplace.focusTitle"></h2>
            <p data-field="marketplace.focusCopy"></p>
          </div>
          <div class="record-list" data-marketplace-listings></div>
        </div>
      </section>

      <section class="section section-light">
        <div class="section-shell">
          <div class="section-heading narrow">
            <p class="eyebrow">Operating principles</p>
            <h2>Designed for responsible reuse</h2>
          </div>
          <div class="principle-grid" data-marketplace-principles></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="section-shell footer-layout">
        <div class="footer-brand">
          <img class="footer-logo" src="./assets/logos/koinos-reversed.png" alt="Koinos Lab" />
          <p>Making scientific tools accessible.</p>
          <a class="footer-email" href="mailto:hello@koinoslab.org">hello@koinoslab.org</a>
        </div>
        <nav aria-label="Footer navigation">
          <a href="./devices.html">Devices</a>
          <a href="./marketplace.html">Marketplace</a>
          <a href="./publications.html">Publications</a>
          <a href="./vision.html">Vision</a>
          <a href="./team.html">Our team</a>
        </nav>
      </div>
    </footer>

    <script src="./content.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
