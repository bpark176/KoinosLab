<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meet the Koinos Lab team working to make scientific and engineering tools more accessible."
    />
    <title>Our Team | Koinos Lab</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logos/koinos-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logos/koinos-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/logos/koinos-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logos/koinos-icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="team">
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="./index.html" aria-label="Koinos Lab home">
          <img class="brand-logo" src="./assets/logos/koinos-reversed.svg" alt="Koinos Lab" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-nav-toggle>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" aria-label="Primary navigation" data-nav>
          <a href="./index.html" data-nav-page="home">Home</a>
          <a href="./devices.html" data-nav-page="devices">Devices</a>
          <a href="./marketplace.html" data-nav-page="marketplace">Marketplace</a>
          <a href="./publications.html" data-nav-page="publications">Publications</a>
          <a href="./vision.html" data-nav-page="vision">Vision</a>
          <a href="./team.html" data-nav-page="team">Our team</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="page-hero-layout">
          <div class="page-hero-copy">
            <div class="page-hero-copy-inner">
              <p class="eyebrow" data-field="team.eyebrow"></p>
              <h1 data-field="team.title"></h1>
              <p class="lead" data-field="team.lead"></p>
            </div>
          </div>
          <figure class="page-hero-media">
            <img
              src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&amp;fit=crop&amp;w=1800&amp;q=84"
              alt="A collaborative research and engineering team working together."
            />
            <figcaption>A deliberate structure for ambitious, responsible work.</figcaption>
          </figure>
        </div>
      </section>

      <section class="section">
        <div class="section-shell">
          <div class="governance-panel">
            <div>
              <p class="eyebrow" data-field="team.governance.eyebrow"></p>
              <h2 data-field="team.governance.title"></h2>
              <p data-field="team.governance.copy"></p>
            </div>
            <div class="governance-roles" data-governance-roles></div>
          </div>
        </div>
      </section>

      <section class="section section-light team-directory-section">
        <div class="section-shell">
          <div class="team-tabs" aria-label="Team directory filters">
            <button type="button" class="is-active" data-team-filter="all" aria-pressed="true">All</button>
            <button type="button" data-team-filter="leadership" aria-pressed="false">Leadership</button>
            <button type="button" data-team-filter="advisors" aria-pressed="false">Advisors</button>
            <button type="button" data-team-filter="members" aria-pressed="false">Members</button>
          </div>
          <div class="team-groups" data-team-groups></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="section-shell footer-layout">
        <div class="footer-brand">
          <img class="footer-logo" src="./assets/logos/koinos-reversed.svg" alt="Koinos Lab" />
          <p>Making scientific tools accessible.</p>
          <a class="footer-email" href="mailto:hello@koinoslab.org">hello@koinoslab.org</a>
        </div>
        <nav aria-label="Footer navigation">
          <a href="./devices.html">Devices</a>
          <a href="./marketplace.html">Marketplace</a>
          <a href="./publications.html">Publications</a>
          <a href="./vision.html">Vision</a>
          <a href="./team.html">Our team</a>
        </nav>
      </div>
    </footer>

    <script src="./content.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
